name: Desktop builds and releases

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'packaging/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - '.gitattributes'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'packaging/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - '.gitattributes'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            python-arch: x64
          - platform: linux
            arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            python-arch: arm64
          - platform: macos
            arch: x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            python-arch: x64
          - platform: macos
            arch: aarch64
            runner: macos-15
            target: aarch64-apple-darwin
            python-arch: arm64
          - platform: windows
            arch: x86_64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            python-arch: x64
            msystem: UCRT64
            compiler: mingw-w64-ucrt-x86_64-gcc
            pkgconf: mingw-w64-ucrt-x86_64-pkgconf
          - platform: windows
            arch: aarch64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            python-arch: arm64
            msystem: CLANGARM64
            compiler: mingw-w64-clang-aarch64-clang mingw-w64-clang-aarch64-llvm mingw-w64-clang-aarch64-lld
            pkgconf: mingw-w64-clang-aarch64-pkgconf
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      RUSTFLAGS: ${{ matrix.platform == 'windows' && '-C target-feature=+crt-static' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: ${{ matrix.python-arch }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-${{ matrix.target }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Validate host and release version
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          TAG: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          python - <<'PY'
          import os, sys, tomllib
          sys.path.insert(0, 'scripts')
          from bundle_common import host_arch
          assert host_arch() == os.environ['EXPECTED_ARCH'], 'Runner must match the published architecture'
          if os.environ['IS_TAG'] == 'true':
              with open('Cargo.toml', 'rb') as f:
                  version = tomllib.load(f)['package']['version']
              assert os.environ['TAG'] == f'v{version}', 'Tag must match Cargo.toml'
          PY
      - name: Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl pkg-config patchelf libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libfontconfig1 libx11-6 libxcursor1 libxrandr2 libxi6 mesa-vulkan-drivers
      - name: macOS build dependencies
        if: matrix.platform == 'macos'
        run: command -v pkg-config || brew install pkgconf
      - name: Preserve POSIX script line endings
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in Path('packaging').rglob('*.sh'):
              path.write_bytes(path.read_bytes().replace(b'\r\n', b'\n'))
          PY
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Test packaging and architecture validation
        run: python -m unittest discover -s tests -p test_packaging.py
      - uses: actions/cache@v4
        with:
          path: |
            target/appimage*/downloads
            target/appimage*/media
            target/appimage*/media-source
            target/bundles/*/downloads
            target/bundles/*/media
            target/bundles/*/media-source
          key: release-media-${{ matrix.platform }}-${{ matrix.arch }}-${{ hashFiles('packaging/**') }}
      - name: Setup Windows media compiler
        if: matrix.platform == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            make diffutils
            ${{ matrix.compiler }}
            ${{ matrix.pkgconf }}
      - name: Prepare Windows media sources
        if: matrix.platform == 'windows'
        run: python scripts/build-native.py --prepare-media
      - name: Build Windows media executables
        if: matrix.platform == 'windows'
        shell: msys2 {0}
        run: |
          workspace=$(cygpath -u "$GITHUB_WORKSPACE")
          build="$workspace/target/bundles/windows-${{ matrix.arch }}"
          if [ ! -f "$build/media/.stamp" ]; then
            cd "$build/media-source"
            sh "$workspace/packaging/build-media.sh" "$build/media"
          fi
      - name: Verify Windows media executables
        if: matrix.platform == 'windows'
        run: python scripts/build-native.py --finish-media
      - name: Build Linux bundles
        if: matrix.platform == 'linux'
        run: python scripts/build-appimage.py
      - name: Build macOS or Windows bundles
        if: matrix.platform != 'linux'
        run: python scripts/build-native.py
      - name: Verify actual release archives and bundled tools
        run: python scripts/verify-bundle.py
      - uses: actions/upload-artifact@v4
        with:
          name: emul-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: emul-*
          merge-multiple: true
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* --verify-tag --title "emul $TAG" --generate-notes
