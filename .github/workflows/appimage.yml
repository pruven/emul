name: Linux bundles

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'packaging/linux/**'
      - 'scripts/build-appimage.py'
      - 'tests/smoke.py'
      - '.github/workflows/appimage.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appimage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl pkg-config patchelf libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libfontconfig1 libx11-6 libxcursor1 libxrandr2 libxi6 mesa-vulkan-drivers
      - name: Validate version tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, tomllib
          with open('Cargo.toml', 'rb') as f:
              version = tomllib.load(f)['package']['version']
          assert os.environ['TAG'] == f'v{version}', 'Tag must match the Cargo.toml version'
          PY
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - uses: actions/cache@v4
        with:
          path: |
            target/appimage/downloads
            target/appimage/media
            target/appimage/media-source
          key: appimage-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packaging/linux/downloads.json', 'packaging/linux/build-ffmpeg.sh') }}
      - name: Build AppImage and executable archive
        run: python3 scripts/build-appimage.py
      - name: Verify executable archive
        run: |
          mkdir -p "target/tar-check/extracted bundle"
          tar -xzf dist/emul-*-linux-x86_64.tar.gz -C "target/tar-check/extracted bundle"
          bundle=("target/tar-check/extracted bundle"/emul-*-linux-x86_64)
          PATH=/nonexistent "${bundle[0]}/emul" --check-tools
          python3 tests/smoke.py --appdir "${bundle[0]}"
          "${bundle[0]}/emul" --snap /tmp/emul-tar.png --scene showcase
      - name: Verify bundled tools without host PATH
        run: |
          mkdir -p target/appimage-check
          cd target/appimage-check
          ../../dist/emul-*-x86_64.AppImage --appimage-extract > /dev/null
          PATH=/nonexistent ./squashfs-root/AppRun --check-tools
          cd ../..
          python3 tests/smoke.py --appdir target/appimage-check/squashfs-root
      - name: Check AppImage launch
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          dist/emul-*-x86_64.AppImage --check-tools
          dist/emul-*-x86_64.AppImage --snap /tmp/emul-appimage.png --scene showcase
      - uses: actions/upload-artifact@v4
        with:
          name: emul-Linux-x86_64
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: appimage
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: emul-Linux-x86_64
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* --verify-tag --title "emul $TAG" --generate-notes
